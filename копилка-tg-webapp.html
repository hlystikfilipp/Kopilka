<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="light">
<title>Копилка · 5 руб в день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f4ecdf;
    --card: #fffaf2;
    --ink: #3a2e1f;
    --ink-soft: #7c6b52;
    --gold: #c9972f;
    --gold-dark: #a5771f;
    --done: #d99b3f;
    --done-2: #b97a24;
    --line: #e5d6bd;
    --shadow: 0 2px 10px rgba(60, 45, 20, 0.08);
  }
  * { box-sizing: border-box; }
  html {
    color-scheme: light;
    background: #f4ecdf;
  }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 16px 12px 40px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .header {
    text-align: center;
    margin-bottom: 18px;
  }
  .header h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 18px 0 20px;
  }
  .stat {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .stat .num {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--gold-dark);
  }
  .stat .label {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .progress-bar {
    height: 10px;
    background: var(--line);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--done-2));
    width: 0%;
    transition: width 0.4s ease;
  }

  .today-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .today-card .txt { font-size: 0.92rem; }
  .today-card .txt b { display: block; font-size: 1rem; margin-bottom: 2px; }
  .today-btn {
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--gold);
    color: white;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  .today-btn:active { transform: scale(0.95); }
  .today-btn.done { background: #8a9a6b; }

  .amount-setting {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 14px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
    font-size: 0.85rem;
    gap: 10px;
  }
  .amount-setting label {
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .amount-setting .amount-input-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .amount-setting input {
    width: 64px;
    border: 1.5px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 16px;
    text-align: center;
    font-family: inherit;
    color: var(--ink);
  }
  .amount-setting .amount-unit {
    color: var(--ink-soft);
    font-size: 0.82rem;
  }

  .month {
    margin-bottom: 22px;
  }
  .month-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 8px 2px;
    text-transform: capitalize;
  }
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .day:active { transform: scale(0.9); }
  .day.done {
    background: var(--done);
    border-color: var(--done-2);
    color: #fff;
    font-weight: 700;
  }
  .day.future {
    opacity: 0.45;
  }
  .day.today {
    border-color: var(--gold-dark);
    border-width: 2px;
  }

  .reset-row {
    text-align: center;
    margin-top: 28px;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .section-title {
    font-size: 1rem;
    font-weight: 700;
    margin: 28px 0 10px 2px;
  }
  .add-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .add-row input {
    flex: 1;
    min-width: 0;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 9px 10px;
    font-size: 16px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
  }
  .add-row input[type="date"] { flex: 1.3; }
  .add-btn {
    width: 100%;
    border: none;
    padding: 10px;
    border-radius: 10px;
    background: var(--gold);
    color: white;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  .add-btn:active { transform: scale(0.98); }
  .add-row .add-btn { flex: 1; }
  .add-btn-minus {
    background: #b5654f;
  }

  .history-toggle {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: none;
    border: none;
    padding: 8px 4px;
    font-size: 0.85rem;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
  }
  .history-arrow {
    transition: transform 0.2s ease;
    font-size: 0.8rem;
  }
  .history-arrow.open {
    transform: rotate(180deg);
  }
  .entry-list-wrap {
    display: grid;
    grid-template-rows: 1fr;
    transition: grid-template-rows 0.25s ease;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .entry-list-wrap.collapsed {
    grid-template-rows: 0fr;
    margin-bottom: 0;
  }
  .entry-list-wrap > .entry-list {
    min-height: 0;
    overflow: hidden;
  }

  .entry-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-bottom: 10px;
  }
  .entry-empty {
    color: var(--ink-soft);
    font-size: 0.85rem;
    text-align: center;
    padding: 10px 0;
  }
  .entry {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 9px 12px;
  }
  .entry .entry-date {
    font-size: 0.85rem;
    color: var(--ink-soft);
  }
  .entry .entry-amount {
    font-weight: 700;
    color: var(--gold-dark);
    margin-left: auto;
    margin-right: 10px;
  }
  .entry .entry-amount.negative {
    color: #a5493a;
  }
  .entry .entry-del {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 1rem;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
  }

  .loading {
    text-align: center;
    padding: 40px 0;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>💰 Копилка · 5 BYN в день</h1>
    <p>Отмечай ежедневные взносы, добавляй и списывай суммы</p>
  </div>

  <div id="loading" class="loading">Загрузка…</div>

  <div id="content" style="display:none;">
    <div class="stats">
      <div class="stat">
        <div class="num" id="statDays">0</div>
        <div class="label">дней отложено</div>
      </div>
      <div class="stat">
        <div class="num" id="statSum">0</div>
        <div class="label">BYN накоплено</div>
      </div>
      <div class="stat">
        <div class="num" id="statStreak">0</div>
        <div class="label">дней подряд</div>
      </div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="amount-setting">
      <label for="dailyAmountInput">Ежедневная сумма</label>
      <div class="amount-input-group">
        <input type="number" id="dailyAmountInput" min="0.01" step="0.01">
        <span class="amount-unit">BYN / день</span>
      </div>
    </div>

    <div class="today-card">
      <div class="txt">
        <b id="todayLabel">Сегодня</b>
        <span id="todayStatus">Ещё не отмечено</span>
      </div>
      <button class="today-btn" id="todayBtn">Отложил 5 BYN</button>
    </div>

    <div class="section-title">Добавить или списать сумму</div>
    <div class="add-card">
      <div class="add-row">
        <input type="date" id="extraDate">
        <input type="number" id="extraAmount" placeholder="Сумма, BYN" min="0" step="0.01">
      </div>
      <div class="add-row">
        <button class="add-btn add-btn-plus" id="extraAddBtn">+ Добавить</button>
        <button class="add-btn add-btn-minus" id="extraWithdrawBtn">− Списать</button>
      </div>
    </div>
    <button class="history-toggle" id="historyToggle" type="button">
      <span id="historyToggleLabel">История операций</span>
      <span class="history-arrow" id="historyArrow">▾</span>
    </button>
    <div class="entry-list-wrap collapsed" id="extraListWrap">
      <div class="entry-list" id="extraList"></div>
    </div>

    <div id="months"></div>

    <div class="reset-row">
      <button class="reset-btn" id="resetBtn">Сбросить всё</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'byn-tracker-2026-2027';
const DEFAULT_DAILY_AMOUNT = 5;
const TOTAL_DAYS = 365;
const MONTH_NAMES = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTH_NAMES_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

let state = { startDate: null, done: {}, extra: [], dailyAmount: DEFAULT_DAILY_AMOUNT }; // done: {"YYYY-MM-DD": true}, extra: [{id, date, amount}]

function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// 'YYYY-MM-DD' по умолчанию парсится JS как UTC-полночь, а не местное время —
// из-за этого при смещении часового пояса сегодняшний день может "потеряться".
// Эта функция всегда парсит строку как местную дату.
function parseLocalDate(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

// --- Обёртки над Telegram CloudStorage (колбэки -> промисы) ---
// Если открыто не в Telegram (например, для отладки в обычном браузере),
// используем localStorage как запасной вариант.
const tg = window.Telegram && window.Telegram.WebApp;
const hasCloud = !!(tg && tg.CloudStorage);

function cloudGet(key) {
  return new Promise((resolve) => {
    if (!hasCloud) return resolve(localStorage.getItem(key));
    tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
  });
}

function cloudSet(key, value) {
  return new Promise((resolve) => {
    if (!hasCloud) { localStorage.setItem(key, value); return resolve(true); }
    tg.CloudStorage.setItem(key, value, (err) => resolve(!err));
  });
}

async function loadState() {
  try {
    const raw = await cloudGet(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.startDate = parsed.startDate || null;
      state.done = parsed.done || {};
      state.extra = Array.isArray(parsed.extra) ? parsed.extra : [];
      state.dailyAmount = (typeof parsed.dailyAmount === 'number' && parsed.dailyAmount > 0)
        ? parsed.dailyAmount
        : DEFAULT_DAILY_AMOUNT;
    }
  } catch (e) {
    // ключа ещё нет — первый запуск
  }
  // Если это первое открытие у этого пользователя — день старта фиксируется
  // как сегодняшний день и больше никогда не меняется для него.
  if (!state.startDate) {
    state.startDate = dateKey(new Date());
    await saveState();
  }
}

async function saveState() {
  try {
    await cloudSet(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('Ошибка сохранения', e);
  }
}

function toggleDay(key, cellEl) {
  const wasDone = !!state.done[key];
  if (wasDone) {
    delete state.done[key];
  } else {
    state.done[key] = true;
  }
  saveState();
  render();
}

function addExtra(dateStr, amount) {
  const entry = {
    id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
    date: dateStr,
    amount: amount
  };
  state.extra.push(entry);
  state.extra.sort((a, b) => a.date < b.date ? 1 : -1); // newest first
  saveState();
  render();
}

function deleteExtra(id) {
  state.extra = state.extra.filter(e => e.id !== id);
  saveState();
  render();
}

function extraTotal() {
  return state.extra.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
}

function computeStreak(startDate, todayKey) {
  // count consecutive done days ending today (or the most recent done day)
  let streak = 0;
  let cursor = parseLocalDate(todayKey);
  while (true) {
    const k = dateKey(cursor);
    if (state.done[k]) {
      streak++;
      cursor = addDays(cursor, -1);
    } else {
      break;
    }
  }
  return streak;
}

function render() {
  const start = parseLocalDate(state.startDate);
  const today = new Date();
  const todayKey = dateKey(today);

  const doneCount = Object.keys(state.done).length;
  const extraSum = extraTotal();
  document.getElementById('statDays').textContent = doneCount;
  document.getElementById('statSum').textContent = Math.max(0, doneCount * state.dailyAmount + extraSum).toLocaleString('ru-RU');
  document.getElementById('statStreak').textContent = computeStreak(start, todayKey);
  document.getElementById('progressFill').style.width = Math.min(100, (doneCount / TOTAL_DAYS) * 100) + '%';

  const isTodayDone = !!state.done[todayKey];
  document.getElementById('todayLabel').textContent = 'Сегодня, ' + today.getDate() + ' ' + MONTH_NAMES[today.getMonth()];
  document.getElementById('todayStatus').textContent = isTodayDone ? 'Отмечено ✓' : 'Ещё не отмечено';
  const btn = document.getElementById('todayBtn');
  btn.textContent = isTodayDone ? '✓ Отложено' : ('Отложил ' + state.dailyAmount + ' BYN');
  btn.classList.toggle('done', isTodayDone);

  const monthsEl = document.getElementById('months');
  monthsEl.innerHTML = '';

  // список дополнительных взносов и списаний
  const listEl = document.getElementById('extraList');
  listEl.innerHTML = '';
  if (state.extra.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'entry-empty';
    empty.textContent = 'Пока нет дополнительных операций';
    listEl.appendChild(empty);
  } else {
    state.extra.forEach(e => {
      const row = document.createElement('div');
      row.className = 'entry';

      const dateEl = document.createElement('span');
      dateEl.className = 'entry-date';
      const d = parseLocalDate(e.date);
      dateEl.textContent = d.getDate() + ' ' + MONTH_NAMES[d.getMonth()] + ' ' + d.getFullYear();

      const amountEl = document.createElement('span');
      const isNegative = Number(e.amount) < 0;
      amountEl.className = 'entry-amount' + (isNegative ? ' negative' : '');
      const sign = isNegative ? '' : '+';
      amountEl.textContent = sign + Number(e.amount).toLocaleString('ru-RU') + ' BYN';

      const delBtn = document.createElement('button');
      delBtn.className = 'entry-del';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', () => deleteExtra(e.id));

      row.appendChild(dateEl);
      row.appendChild(amountEl);
      row.appendChild(delBtn);
      listEl.appendChild(row);
    });
  }

  const toggleLabel = document.getElementById('historyToggleLabel');
  toggleLabel.textContent = state.extra.length === 0
    ? 'История операций'
    : 'История операций (' + state.extra.length + ')';

  const end = addDays(start, TOTAL_DAYS - 1);
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);

  while (cursor <= end) {
    const monthEl = document.createElement('div');
    monthEl.className = 'month';
    const title = document.createElement('div');
    title.className = 'month-title';
    title.textContent = MONTH_NAMES_NOM[cursor.getMonth()] + ' ' + cursor.getFullYear();
    monthEl.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'days-grid';

    const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
    const firstDow = (new Date(cursor.getFullYear(), cursor.getMonth(), 1).getDay() + 6) % 7; // Mon=0

    for (let i = 0; i < firstDow; i++) {
      const empty = document.createElement('div');
      grid.appendChild(empty);
    }

    for (let dnum = 1; dnum <= daysInMonth; dnum++) {
      const d = new Date(cursor.getFullYear(), cursor.getMonth(), dnum);
      if (d < start || d > end) {
        const empty = document.createElement('div');
        grid.appendChild(empty);
        continue;
      }
      const k = dateKey(d);
      const cell = document.createElement('div');
      cell.className = 'day';
      if (state.done[k]) cell.classList.add('done');
      if (d > today) cell.classList.add('future');
      if (k === todayKey) cell.classList.add('today');
      cell.textContent = dnum;
      cell.addEventListener('click', () => toggleDay(k, cell));
      grid.appendChild(cell);
    }

    monthEl.appendChild(grid);
    monthsEl.appendChild(monthEl);
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }

  document.getElementById('todayBtn').onclick = () => toggleDay(todayKey);
}

document.getElementById('historyToggle').addEventListener('click', () => {
  const wrap = document.getElementById('extraListWrap');
  const arrow = document.getElementById('historyArrow');
  const isCollapsed = wrap.classList.toggle('collapsed');
  arrow.classList.toggle('open', !isCollapsed);
});

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (confirm('Точно сбросить весь прогресс?')) {
    state.done = {};
    state.extra = [];
    state.dailyAmount = DEFAULT_DAILY_AMOUNT;
    document.getElementById('dailyAmountInput').value = state.dailyAmount;
    await saveState();
    render();
  }
});

document.getElementById('dailyAmountInput').addEventListener('change', (e) => {
  const val = parseFloat(e.target.value);
  if (!val || val <= 0) {
    e.target.value = state.dailyAmount;
    return;
  }
  state.dailyAmount = val;
  saveState();
  render();
});

document.getElementById('extraAddBtn').addEventListener('click', () => {
  const dateInput = document.getElementById('extraDate');
  const amountInput = document.getElementById('extraAmount');
  const dateVal = dateInput.value;
  const amountVal = parseFloat(amountInput.value);

  if (!dateVal) {
    alert('Выбери дату');
    return;
  }
  if (!amountVal || amountVal <= 0) {
    alert('Введи сумму больше нуля');
    return;
  }

  addExtra(dateVal, amountVal);
  amountInput.value = '';
});

document.getElementById('extraWithdrawBtn').addEventListener('click', () => {
  const dateInput = document.getElementById('extraDate');
  const amountInput = document.getElementById('extraAmount');
  const dateVal = dateInput.value;
  const amountVal = parseFloat(amountInput.value);

  if (!dateVal) {
    alert('Выбери дату');
    return;
  }
  if (!amountVal || amountVal <= 0) {
    alert('Введи сумму больше нуля');
    return;
  }

  addExtra(dateVal, -amountVal);
  amountInput.value = '';
});

(async () => {
  if (tg) {
    tg.ready();
    tg.expand();
  }
  await loadState();
  document.getElementById('extraDate').value = dateKey(new Date());
  document.getElementById('dailyAmountInput').value = state.dailyAmount;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  render();
})();
</script>
</body>
</html>
