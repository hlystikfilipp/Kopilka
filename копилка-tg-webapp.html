<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Копилка · 5 руб в день</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #f4ecdf;
    --card: #fffaf2;
    --ink: #3a2e1f;
    --ink-soft: #7c6b52;
    --gold: #c9972f;
    --gold-dark: #a5771f;
    --done: #d99b3f;
    --done-2: #b97a24;
    --line: #e5d6bd;
    --shadow: 0 2px 10px rgba(60, 45, 20, 0.08);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 16px 12px 40px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  .header {
    text-align: center;
    margin-bottom: 18px;
  }
  .header h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
  }
  .header p {
    margin: 0;
    color: var(--ink-soft);
    font-size: 0.9rem;
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 18px 0 20px;
  }
  .stat {
    background: var(--card);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .stat .num {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--gold-dark);
  }
  .stat .label {
    font-size: 0.72rem;
    color: var(--ink-soft);
    margin-top: 2px;
  }

  .progress-bar {
    height: 10px;
    background: var(--line);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 22px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--done-2));
    width: 0%;
    transition: width 0.4s ease;
  }

  .today-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .today-card .txt { font-size: 0.92rem; }
  .today-card .txt b { display: block; font-size: 1rem; margin-bottom: 2px; }
  .today-btn {
    border: none;
    padding: 10px 18px;
    border-radius: 999px;
    background: var(--gold);
    color: white;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.1s ease, background 0.2s ease;
  }
  .today-btn:active { transform: scale(0.95); }
  .today-btn.done { background: #8a9a6b; }

  .month {
    margin-bottom: 22px;
  }
  .month-title {
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--ink);
    margin: 0 0 8px 2px;
    text-transform: capitalize;
  }
  .days-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day {
    aspect-ratio: 1;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: var(--card);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.72rem;
    color: var(--ink-soft);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, transform 0.1s ease, border-color 0.15s ease;
  }
  .day:active { transform: scale(0.9); }
  .day.done {
    background: var(--done);
    border-color: var(--done-2);
    color: #fff;
    font-weight: 700;
  }
  .day.future {
    opacity: 0.45;
  }
  .day.today {
    border-color: var(--gold-dark);
    border-width: 2px;
  }

  .reset-row {
    text-align: center;
    margin-top: 28px;
  }
  .reset-btn {
    background: none;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 8px 14px;
    border-radius: 10px;
    font-size: 0.8rem;
    cursor: pointer;
  }

  .loading {
    text-align: center;
    padding: 40px 0;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>💰 Копилка · 5 BYN в день</h1>
    <p>Год отслеживания · нажимай на день, когда отложил</p>
  </div>

  <div id="loading" class="loading">Загрузка…</div>

  <div id="content" style="display:none;">
    <div class="stats">
      <div class="stat">
        <div class="num" id="statDays">0</div>
        <div class="label">дней отложено</div>
      </div>
      <div class="stat">
        <div class="num" id="statSum">0</div>
        <div class="label">BYN накоплено</div>
      </div>
      <div class="stat">
        <div class="num" id="statStreak">0</div>
        <div class="label">дней подряд</div>
      </div>
    </div>

    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="today-card">
      <div class="txt">
        <b id="todayLabel">Сегодня</b>
        <span id="todayStatus">Ещё не отмечено</span>
      </div>
      <button class="today-btn" id="todayBtn">Отложил 5 BYN</button>
    </div>

    <div id="months"></div>

    <div class="reset-row">
      <button class="reset-btn" id="resetBtn">Сбросить всё</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'byn-tracker-2026-2027';
const DAILY_AMOUNT = 5;
const TOTAL_DAYS = 365;
const MONTH_NAMES = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTH_NAMES_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WEEKDAYS = ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];

let state = { startDate: null, done: {} }; // done: {"YYYY-MM-DD": true}

function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

// --- Обёртки над Telegram CloudStorage (колбэки -> промисы) ---
// Если открыто не в Telegram (например, для отладки в обычном браузере),
// используем localStorage как запасной вариант.
const tg = window.Telegram && window.Telegram.WebApp;
const hasCloud = !!(tg && tg.CloudStorage);

function cloudGet(key) {
  return new Promise((resolve) => {
    if (!hasCloud) return resolve(localStorage.getItem(key));
    tg.CloudStorage.getItem(key, (err, value) => resolve(err ? null : value));
  });
}

function cloudSet(key, value) {
  return new Promise((resolve) => {
    if (!hasCloud) { localStorage.setItem(key, value); return resolve(true); }
    tg.CloudStorage.setItem(key, value, (err) => resolve(!err));
  });
}

async function loadState() {
  try {
    const raw = await cloudGet(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.startDate = parsed.startDate;
      state.done = parsed.done || {};
    }
  } catch (e) {
    // ключа ещё нет — первый запуск
  }
  if (!state.startDate) {
    state.startDate = '2026-08-29';
  }
}

async function saveState() {
  try {
    await cloudSet(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('Ошибка сохранения', e);
  }
}

function toggleDay(key, cellEl) {
  const wasDone = !!state.done[key];
  if (wasDone) {
    delete state.done[key];
  } else {
    state.done[key] = true;
  }
  saveState();
  render();
}

function computeStreak(startDate, todayKey) {
  // count consecutive done days ending today (or the most recent done day)
  let streak = 0;
  let cursor = new Date(todayKey);
  while (true) {
    const k = dateKey(cursor);
    if (state.done[k]) {
      streak++;
      cursor = addDays(cursor, -1);
    } else {
      break;
    }
  }
  return streak;
}

function render() {
  const start = new Date(state.startDate);
  const today = new Date();
  const todayKey = dateKey(today);

  const doneCount = Object.keys(state.done).length;
  document.getElementById('statDays').textContent = doneCount;
  document.getElementById('statSum').textContent = (doneCount * DAILY_AMOUNT).toLocaleString('ru-RU');
  document.getElementById('statStreak').textContent = computeStreak(start, todayKey);
  document.getElementById('progressFill').style.width = Math.min(100, (doneCount / TOTAL_DAYS) * 100) + '%';

  const isTodayDone = !!state.done[todayKey];
  document.getElementById('todayLabel').textContent = 'Сегодня, ' + today.getDate() + ' ' + MONTH_NAMES[today.getMonth()];
  document.getElementById('todayStatus').textContent = isTodayDone ? 'Отмечено ✓' : 'Ещё не отмечено';
  const btn = document.getElementById('todayBtn');
  btn.textContent = isTodayDone ? '✓ Отложено' : 'Отложил 5 BYN';
  btn.classList.toggle('done', isTodayDone);

  const monthsEl = document.getElementById('months');
  monthsEl.innerHTML = '';

  const end = addDays(start, TOTAL_DAYS - 1);
  let cursor = new Date(start.getFullYear(), start.getMonth(), 1);

  while (cursor <= end) {
    const monthEl = document.createElement('div');
    monthEl.className = 'month';
    const title = document.createElement('div');
    title.className = 'month-title';
    title.textContent = MONTH_NAMES_NOM[cursor.getMonth()] + ' ' + cursor.getFullYear();
    monthEl.appendChild(title);

    const grid = document.createElement('div');
    grid.className = 'days-grid';

    const daysInMonth = new Date(cursor.getFullYear(), cursor.getMonth()+1, 0).getDate();
    const firstDow = (new Date(cursor.getFullYear(), cursor.getMonth(), 1).getDay() + 6) % 7; // Mon=0

    for (let i = 0; i < firstDow; i++) {
      const empty = document.createElement('div');
      grid.appendChild(empty);
    }

    for (let dnum = 1; dnum <= daysInMonth; dnum++) {
      const d = new Date(cursor.getFullYear(), cursor.getMonth(), dnum);
      if (d < start || d > end) {
        const empty = document.createElement('div');
        grid.appendChild(empty);
        continue;
      }
      const k = dateKey(d);
      const cell = document.createElement('div');
      cell.className = 'day';
      if (state.done[k]) cell.classList.add('done');
      if (d > today) cell.classList.add('future');
      if (k === todayKey) cell.classList.add('today');
      cell.textContent = dnum;
      cell.addEventListener('click', () => toggleDay(k, cell));
      grid.appendChild(cell);
    }

    monthEl.appendChild(grid);
    monthsEl.appendChild(monthEl);
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }

  document.getElementById('todayBtn').onclick = () => toggleDay(todayKey);
}

document.getElementById('resetBtn').addEventListener('click', async () => {
  if (confirm('Точно сбросить весь прогресс?')) {
    state.done = {};
    await saveState();
    render();
  }
});

(async () => {
  if (tg) {
    tg.ready();
    tg.expand();
  }
  await loadState();
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
  render();
})();
</script>
</body>
</html>
